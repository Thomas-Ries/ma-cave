<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Ma Cave">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A3547"/>
      <stop offset="1" stop-color="#6A2836"/>
    </linearGradient>
  </defs>

  <!-- Même visuel que le splashscreen : disque bordeaux, verre à vin blanc -->
  <rect width="120" height="120" rx="27" fill="url(#bg)"/>

  <!-- Halo discret, comme le splash -->
  <circle cx="60" cy="60" r="44" fill="#FAF6F1" opacity="0.05"/>

  <!-- Verre à vin blanc (icône « glass » du splash, centrée) -->
  <g transform="translate(33 33) scale(2.25)" fill="none" stroke="#FAF6F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3h8m-8 0c0 4.418 1.79 8 4 8s4-3.582 4-8M12 11v8m-4 2h8"/>
  </g>
</svg>
