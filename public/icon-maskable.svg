<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Ma Cave">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A3547"/>
      <stop offset="1" stop-color="#6A2836"/>
    </linearGradient>
  </defs>

  <!-- Version maskable : fond plein sur toute la zone, verre réduit dans la zone de sûreté -->
  <rect width="120" height="120" fill="url(#bg)"/>

  <circle cx="60" cy="60" r="34" fill="#FAF6F1" opacity="0.05"/>

  <!-- Verre à vin blanc, contenu dans le cercle central de sûreté (~66 %) -->
  <g transform="translate(41 41) scale(1.58)" fill="none" stroke="#FAF6F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3h8m-8 0c0 4.418 1.79 8 4 8s4-3.582 4-8M12 11v8m-4 2h8"/>
  </g>
</svg>
